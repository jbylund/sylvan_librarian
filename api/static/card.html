<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the stored theme before first paint: the markup defaults to dark, and the deferred
      // bundle re-reads the preference too late for light-theme users to avoid a dark flash.
      try {
        var storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (e) {
        // localStorage may be unavailable; keep the default theme
      }
    </script>
    <meta name="theme-color" content="#2b8fdf" />
    <!-- FAVICON -->
    <!-- PRECONNECTS -->
    <!-- FONTS -->
    <!-- CSS -->
    <title>%%%SITENAME%%%</title>
    <script src="/static/card.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span id="themeIcon">☀️</span>
        </button>
        <h1 id="site-title"><a href="/" style="text-decoration: none; color: inherit">%%%SITENAME%%%</a></h1>
      </div>

      <div class="spacer spacer-30"></div>

      <div id="card-page">
        <div id="card-loading" class="card-page-loading">Loading...</div>
        <div id="card-face" class="card-page-face" style="display: none"></div>
        <div id="other-printings" class="card-page-printings" style="display: none">
          <h2 class="printings-heading">Other Printings</h2>
          <div id="printings-list" class="printings-strip"></div>
        </div>
      </div>

      <!-- FOOTER -->
    </div>
  </body>
</html>
